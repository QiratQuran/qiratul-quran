<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tajweed Guide | Qiratul Quran</title>
<meta name="description" content="A complete guide to the Tajweed color-coding used throughout Qiratul Quran, based on the standard rules of Quranic recitation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <a href="settings.html" class="back-link" aria-label="Back to Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <span class="brand-name">Tajweed Guide</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between light and dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.55 1.55M18.25 18.25l1.55 1.55M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.55-1.55M18.25 5.75l1.55-1.55"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a6.8 6.8 0 0 0 10.2 10.2Z"/></svg>
    </button>
  </header>

  <main class="content">
    <p class="page-intro">
      When Tajweed coloring is turned on in the Quran Reader (the dot icon in the top bar), each rule below is highlighted in its corresponding color. This helps you recognize and apply the correct pronunciation rules as you recite.
    </p>

    <ul class="tajweed-legend" id="tajweedLegend"></ul>
  </main>

</div>

<script src="script.js"></script>
<script src="tajweed-guide.js"></script>
</body>
</html>
