<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Quran — 114 Surahs | Qiratul Quran</title>
<meta name="description" content="Browse all 114 Surahs of the Holy Quran, search by name, or navigate by Juz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <a href="index.html" class="back-link" aria-label="Back to Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <span class="brand-name">The Quran</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch between light and dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.55 1.55M18.25 18.25l1.55 1.55M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.55-1.55M18.25 5.75l1.55-1.55"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a6.8 6.8 0 0 0 10.2 10.2Z"/></svg>
    </button>
  </header>

  <main class="content">

    <!-- Search -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="search-icon"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="searchInput" placeholder="Search Surah by name or number" autocomplete="off">
    </div>

    <!-- Tabs -->
    <div class="tab-group" role="tablist">
      <button class="tab is-active" id="tabSurah" role="tab" aria-selected="true">Surah</button>
      <button class="tab" id="tabJuz" role="tab" aria-selected="false">Juz</button>
    </div>

    <!-- Loading -->
    <div id="loadingState" class="state-message">Loading Surah list…</div>

    <!-- Error -->
    <div id="errorState" class="state-message" hidden>
      Couldn't load the Surah list right now. Please check your connection and
      <button id="retryBtn" class="link-btn">try again</button>.
    </div>

    <!-- Surah list -->
    <ul id="surahList" class="item-list" hidden></ul>

    <!-- Juz list -->
    <ul id="juzList" class="item-list" hidden></ul>

    <!-- No results -->
    <div id="noResults" class="state-message" hidden>No Surah matches your search.</div>

  </main>

  <!-- Bottom nav (mobile) -->
  <nav class="bottom-nav" aria-label="Primary">
    <a class="nav-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5h12V10"/></svg>
      <span>Home</span>
    </a>
    <a class="nav-item is-active" href="quran.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11a2 2 0 0 1 2 2v14a1.5 1.5 0 0 0-1.5-1.5H4z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13a2 2 0 0 0-2 2v14a1.5 1.5 0 0 1 1.5-1.5H20z"/></svg>
      <span>Quran</span>
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search</span>
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5h9a1.5 1.5 0 0 1 1.5 1.5v16l-6-4-6 4V5A1.5 1.5 0 0 1 6 3.5Z"/></svg>
      <span>Saved</span>
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1-3.5 4-5.3 7-5.3S18 16.5 19 20"/></svg>
      <span>Account</span>
    </a>
  </nav>

</div>

<script src="script.js"></script>
<script src="quran.js"></script>
</body>
</html>
